name: Person 3 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify
      - name: Verify Linux
        if: runner.os != 'Windows'
        run: sh ./mvnw -B -ntp clean verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r cloud-service/tools/contract-requirements.txt
      - run: python cloud-service/tools/validate_contract.py
