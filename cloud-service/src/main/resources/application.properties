spring.application.name=cloud-service
server.port=${SERVER_PORT:8083}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
logging.level.org.springframework.web=INFO
server.compression.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.mapper.allow-coercion-of-scalars=false
cloud.model-location=${CLOUD_MODEL_LOCATION:classpath:model/reference.onnx}
cloud.model-sha256=${CLOUD_MODEL_SHA256:}
cloud.model-version=${CLOUD_MODEL_VERSION:reference-v1}
cloud.probe-max-bytes=1048576
