server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

spring:
  h2:
    console:
      enabled: false
  datasource:
    url: jdbc:h2:file:./aecai-history-secure;CIPHER=AES;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${H2_USERNAME:sa}
    password: "${H2_PASSWORD}"

security:
  dashboard:
    username: ${DASHBOARD_USERNAME}
    password: ${DASHBOARD_PASSWORD}
  internal-api-key: ${INTERNAL_API_KEY}
  rate-limit-per-minute: ${SECURITY_RATE_LIMIT_PER_MINUTE:300}
  login-rate-limit-per-minute: ${SECURITY_LOGIN_RATE_LIMIT_PER_MINUTE:10}
