server:
  address: 127.0.0.1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

spring:
  h2:
    console:
      enabled: false

security:
  dashboard:
    username: ${DASHBOARD_USERNAME}
    password: ${DASHBOARD_PASSWORD}
