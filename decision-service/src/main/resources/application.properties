spring.application.name=decision-service
server.port=8082

services.estimator.base-url=${ESTIMATOR_BASE_URL:http://127.0.0.1:8084}
server.address=127.0.0.1
decision.scoring.config=${DECISION_SCORING_CONFIG:classpath:decision-config.json}

# Reject explicit nulls instead of turning missing telemetry into zero-valued primitives.
spring.jackson.deserialization.fail-on-null-for-primitives=true
