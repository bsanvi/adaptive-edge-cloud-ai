spring.application.name=route-estimator
server.port=${ESTIMATOR_PORT:8084}
server.address=127.0.0.1
server.error.include-message=never
logging.level.org.springframework.web=INFO
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.mapper.allow-coercion-of-scalars=false
# Prototype assumptions, not measured calibration. Times include feature work.
estimate.calibration-version=prototype-v1
estimate.edge-ms=10,30,80
estimate.cloud-ms=5,15,40
estimate.hybrid-cloud-ms=4,12,32
estimate.preprocess-ms=1,3,8
estimate.postprocess-ms=1
estimate.edge-power-w=15
estimate.cloud-power-w=35
estimate.transfer-j-per-mb=0.5
estimate.network-carbon-g-per-kwh=500
estimate.probe-max-age-ms=5000
